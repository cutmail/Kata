name: Release

on:
  push:
    tags:
      - "v*"

# 権限は job 単位で最小限に付与する（workflow 全体には付けない）。
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Releases の作成に必要
      id-token: write # provenance 用の OIDC トークン発行に必要
      attestations: write # attestation の書き込みに必要
    steps:
      # シークレットに触れる job なので、Action はすべて commit SHA でピンする。
      # タグは書き換え可能なため、タグ参照では上流の乗っ取りをそのまま取り込んでしまう。
      # 更新は Dependabot（.github/dependabot.yml）が SHA ごと提案する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod が宣言する Go で固定する。stable 指定だと脆弱性修正前の
          # ツールチェーンでリリースを作ってしまう可能性がある。
          go-version-file: go.mod

      - run: go test ./...

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # GoReleaser 本体も正確な版に固定する（"~> v2" だと実行時に版が動く）。
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap 更新用のトークン。
          # classic PAT の repo スコープは全リポジトリの読み書きを与えてしまうため使わない。
          # cutmail/homebrew-tap 1 本だけを対象にした fine-grained PAT を作り、
          # 権限は Contents: Read and write のみを付与すること。詳細は SECURITY.md を参照。
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # 成果物に GitHub ネイティブの SLSA build provenance を付与する。
      # checksums.txt は成果物と同じ Release に置かれるので、
      # リリースを差し替えられる攻撃者は checksums.txt も差し替えられる。
      # provenance は GitHub 側の透明性ログに記録されるため、それができない。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*/kata
            dist/*/kata.exe
