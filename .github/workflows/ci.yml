name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI はリポジトリを読むだけでよい。既定の書き込み権限を明示的に落とす。
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Action は commit SHA でピンする（タグは書き換え可能なため）。
      # 更新は Dependabot（.github/dependabot.yml）が SHA ごと提案する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod が宣言する Go で固定する（脆弱性修正済みの版を保証するため）。
          go-version-file: go.mod
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -short ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # リリース時に go.sum が書き換わらないよう、tidy 済みであることをここで担保する。
      # GoReleaser は作業ツリーが汚れているとリリースを中断するため、
      # ここを通しておかないとタグを打った時点で初めて失敗する。
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify module checksums
        run: go mod verify

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # 依存だけでなく Go 標準ライブラリの既知脆弱性も検出する。
      # 到達しないコードパスは報告されないため、出た指摘は原則すべて対応対象。
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
